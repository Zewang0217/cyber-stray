# WebSocket 升级头映射：必须位于 http 上下文（server 块外）——本文件整份被
# include 进 http 块
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Nginx + sslip.io + Let's Encrypt 模板（PWA / Web Push 需要 HTTPS）。
# NOTE: 这是参考模板；生产机实际生效的 /etc/nginx/sites-available/cyber-stray
# 由主机维护，与本文件存在偏差（当前生产仅 HTTP，且含无关服务的路由）。
#
# 域名: <服务名>.<服务器IP>.sslip.io  自动解析到该 IP,免费无需注册。
# 用法(替换 <HOST> 为实际域名,如 cyber-stray.1.2.3.4.sslip.io):
#   1) 安装: sudo apt install nginx certbot python3-certbot-nginx
#   2) 本文件复制到 /etc/nginx/sites-available/cyber-stray,软链启用
#   3) certbot --nginx -d <HOST>        # 自动签证书 + 改 443 配置
#   4) sudo nginx -t && sudo systemctl reload nginx
# 后端端口:web :3000(Next standalone),site :3001(官网静态),CP :8787(web rewrites 内部代理 /api/*)

server {
    listen 80;
    listen [::]:80;
    server_name <HOST>;

    # Let's Encrypt HTTP-01 验证目录(certbot 自动放)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <HOST>;

    # certbot --nginx 后自动填入证书路径

    # 请求体上限：素材/表情包上传，缺省 1m 会 413
    client_max_body_size 20m;

    # 全部 → web(Next standalone 内部 rewrites 把 /api/* 代理到 CP :8787)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级（实时流）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE(/api/events)长连接:关缓冲 + 读超时放宽
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Casdoor OIDC(经 /casdoor/ 前缀;app.conf 的 origin 需同步为 https://<HOST>/casdoor)
    location /casdoor/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Casdoor 静态资源(页面引用根路径 /static/*)
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}

