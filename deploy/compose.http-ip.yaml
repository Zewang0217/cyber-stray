# 仅显式 --mode http_ip 使用；Docker Compose >= 2.24.4。
# !override 必须替换列表，不能把 HTTPS 端口/证书挂载合并进验收环境。
services:
  casdoor:
    ports: !override
      - "8000:8000"
  nginx:
    volumes: !override
      - /opt/cyber-stray/deploy/nginx-http-ip/cyber-stray.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "80:80"
