# 生产入口：证书、备案、OIDC 域名切换须在同一窗口准备完成。
# 首次签发证书使用 compose.bootstrap.yaml；准备不足由发布预检阻断。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 未限制源站仅允许 Cloudflare 前，不信任客户端提供的真实 IP 头。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kleinbottle.top app.kleinbottle.top auth.kleinbottle.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /healthz { return 200 "ok\n"; }
    location / { return 308 https://$host$request_uri; }
}

ssl_certificate /etc/letsencrypt/live/kleinbottle.top/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/kleinbottle.top/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.kleinbottle.top;
    client_max_body_size 20m;
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.kleinbottle.top;
    location / {
        proxy_pass http://casdoor:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kleinbottle.top;
    location / {
        proxy_pass http://site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
