# cyber-stray 统一入口（阶段一：HTTP-only，供 certbot webroot 签发证书）。
# 证书签出后切阶段二：加 443 块 + HTTP 全量跳转（见 README）。
# kleinbottle.top 经 Cloudflare 橙云代理，CF 面板 SSL/TLS 模式须为 Full (strict)。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# CF 经 CF-Connecting-IP 头传真实客户端 IP。
# NOTE: 在防火墙限制 80/443 仅 CF IP 段之前，直连源站可伪造此头（仅影响日志）。
real_ip_header CF-Connecting-IP;

# web 伴侣端；兼 default_server 承接 http://<IP>/ 直达（切换期不断服）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.kleinbottle.top;

    # 素材/表情包上传，缺省 1m 会 413
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /healthz { return 200 "ok\n"; }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket（实时通道）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE（/api/events）：关缓冲 + 放宽读超时（CP 心跳 25s < CF 空闲超时 100s）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

# casdoor（OIDC）
server {
    listen 80;
    listen [::]:80;
    server_name auth.kleinbottle.top;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://casdoor:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# 官网 apex：site 已进 compose 但尚未发布（镜像未构建），发布时把 404 换成
# proxy_pass http://site（容器内 80 端口）
server {
    listen 80;
    listen [::]:80;
    server_name kleinbottle.top;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
