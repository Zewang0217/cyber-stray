<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradient)"/>

  <!-- Subtle center glow -->
  <ellipse cx="640" cy="360" rx="600" ry="300" fill="url(#glowCenter)"/>

  <!-- Page header -->
  <text x="60" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6c7086">07 / Future</text>
  <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">自改进方向</text>
  <text x="60" y="130" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#a6adc8">让 Agent 越来越懂你，越来越聪明</text>

  <!-- Four directions as cards -->
  <g transform="translate(60, 170)">
    <!-- Direction 1 -->
    <rect x="0" y="0" width="560" height="140" rx="12" fill="#181825" stroke="#cba6f7" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/brain" width="28" height="28" fill="#cba6f7"/>
    </g>
    <text x="70" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">用户隐式偏好挖掘</text>
    <text x="70" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">从 wander-history、speak 结果、行为数据推断偏好</text>
    <text x="24" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086">多维度推断：话题 / 内容深度 / 来源 / 时机</text>
    <text x="24" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086">贝叶斯置信度更新机制</text>

    <!-- Direction 2 -->
    <rect x="600" y="0" width="560" height="140" rx="12" fill="#181825" stroke="#89b4fa" stroke-width="1"/>
    <g transform="translate(624, 24)">
      <use data-icon="chunk-filled/search" width="28" height="28" fill="#89b4fa"/>
    </g>
    <text x="670" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">搜索策略自适应</text>
    <text x="670" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">自适应选择 adapter（query类型 → 最优引擎）</text>
    <text x="624" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086">查询词演化 / 来源可信度学习</text>
    <text x="624" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086">多步搜索策略优化</text>

    <!-- Direction 3 -->
    <rect x="0" y="160" width="560" height="140" rx="12" fill="#181825" stroke="#f9e2af" stroke-width="1"/>
    <g transform="translate(24, 184)">
      <use data-icon="chunk-filled/globe" width="28" height="28" fill="#f9e2af"/>
    </g>
    <text x="70" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">Agent 兴趣自主扩展</text>
    <text x="70" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">agentInterests 从硬编码改为可进化</text>
    <text x="24" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086">基于游荡发现主动扩展兴趣领域</text>
    <text x="24" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086">有边界控制的兴趣列表进化</text>

    <!-- Direction 4 -->
    <rect x="600" y="160" width="560" height="140" rx="12" fill="#181825" stroke="#f38ba8" stroke-width="1"/>
    <g transform="translate(624, 184)">
      <use data-icon="chunk-filled/database" width="28" height="28" fill="#f38ba8"/>
    </g>
    <text x="670" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">记忆质量评估</text>
    <text x="670" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">consolidate 逻辑增强</text>
    <text x="624" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086">knowledge 被使用后 importance 提升</text>
    <text x="624" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086">信念系统更新机制</text>
  </g>

  <!-- Vision statement -->
  <rect x="60" y="510" width="1160" height="130" rx="12" fill="#181825" stroke="#cba6f7" stroke-width="1" opacity="0.8"/>
  <g transform="translate(100, 545)">
    <use data-icon="chunk-filled/robot" width="32" height="32" fill="#cba6f7"/>
  </g>
  <text x="160" y="565" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#cdd6f4" font-weight="600">愿景</text>
  <text x="160" y="595" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#a6adc8">成为一个真正"懂你"的信息伙伴 — 不只是工具，而是一个会成长、会学习、</text>
  <text x="160" y="620" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#a6adc8">会在互联网中四处游荡、发现有趣事物、并主动分享给你的数字生命体。</text>

  <!-- Footer -->
  <text x="640" y="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086" text-anchor="middle">Thanks</text>
</svg>