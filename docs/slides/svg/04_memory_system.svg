<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="layer1Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="layer2Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="layer3Gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f9e2af" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f9e2af" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradient)"/>

  <!-- Page header -->
  <text x="60" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6c7086">03 / Memory</text>
  <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">三层记忆架构</text>

  <!-- Three layer cards -->
  <!-- Layer 1: User Profile -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="360" height="200" rx="16" fill="url(#layer1Gradient)" stroke="#cba6f7" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/users" width="32" height="32" fill="#cba6f7"/>
    </g>
    <text x="24" y="90" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#cba6f7" font-weight="700">Layer 1</text>
    <text x="24" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">用户画像</text>
    <text x="24" y="145" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#a6adc8">User Profile</text>
    <text x="24" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#a6adc8">偏好 / 信心 / 反馈追踪</text>
  </g>

  <!-- Layer 2: Long-Term Memory -->
  <g transform="translate(460, 140)">
    <rect x="0" y="0" width="360" height="200" rx="16" fill="url(#layer2Gradient)" stroke="#89b4fa" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/brain" width="32" height="32" fill="#89b4fa"/>
    </g>
    <text x="24" y="90" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#89b4fa" font-weight="700">Layer 2</text>
    <text x="24" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">长期记忆</text>
    <text x="24" y="145" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#a6adc8">Long-Term Memory</text>
    <text x="24" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#a6adc8">Markdown 文件存储，INDEX.md 索引</text>
  </g>

  <!-- Layer 3: Memory Context -->
  <g transform="translate(860, 140)">
    <rect x="0" y="0" width="360" height="200" rx="16" fill="url(#layer3Gradient)" stroke="#f9e2af" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/terminal" width="32" height="32" fill="#f9e2af"/>
    </g>
    <text x="24" y="90" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#f9e2af" font-weight="700">Layer 3</text>
    <text x="24" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">记忆上下文</text>
    <text x="24" y="145" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#a6adc8">Memory Context</text>
    <text x="24" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#a6adc8">构建注入 prompt 的上下文</text>
  </g>

  <!-- Architecture description -->
  <rect x="60" y="380" width="1160" height="260" rx="16" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="100" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#cdd6f4" font-weight="600">记忆流程</text>

  <g transform="translate(100, 460)">
    <!-- Step 1 -->
    <circle cx="20" cy="20" r="24" fill="#cba6f7" opacity="0.2"/>
    <text x="20" y="26" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#cba6f7" text-anchor="middle" font-weight="600">1</text>
    <text x="60" y="16" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">收集</text>
    <text x="60" y="36" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">用户行为、反馈、偏好数据</text>

    <path d="M140,20 L180,20" stroke="#313244" stroke-width="1" fill="none"/>

    <!-- Step 2 -->
    <circle cx="220" cy="20" r="24" fill="#89b4fa" opacity="0.2"/>
    <text x="220" y="26" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#89b4fa" text-anchor="middle" font-weight="600">2</text>
    <text x="260" y="16" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">存储</text>
    <text x="260" y="36" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">Markdown 文件 + INDEX 索引</text>

    <path d="M380,20 L420,20" stroke="#313244" stroke-width="1" fill="none"/>

    <!-- Step 3 -->
    <circle cx="460" cy="20" r="24" fill="#f9e2af" opacity="0.2"/>
    <text x="460" y="26" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#f9e2af" text-anchor="middle" font-weight="600">3</text>
    <text x="500" y="16" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">构建</text>
    <text x="500" y="36" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">buildMemoryContext() 组装上下文</text>

    <path d="M640,20 L680,20" stroke="#313244" stroke-width="1" fill="none"/>

    <!-- Step 4 -->
    <circle cx="720" cy="20" r="24" fill="#f38ba8" opacity="0.2"/>
    <text x="720" y="26" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#f38ba8" text-anchor="middle" font-weight="600">4</text>
    <text x="760" y="16" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">注入</text>
    <text x="760" y="36" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">系统 prompt 携带记忆上下文</text>
  </g>

  <!-- Footer -->
  <text x="640" y="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086" text-anchor="middle">04 / Tools</text>
</svg>