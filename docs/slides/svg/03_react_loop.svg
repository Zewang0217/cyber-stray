<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cba6f7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradient)"/>

  <!-- Page header -->
  <text x="60" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6c7086">02 / Architecture</text>
  <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">ReAct Loop 架构</text>

  <!-- Loop diagram area -->
  <g transform="translate(60, 160)">
    <!-- Central loop circle with components -->

    <!-- LLM node -->
    <rect x="400" y="0" width="160" height="80" rx="12" fill="#181825" stroke="#cba6f7" stroke-width="2"/>
    <text x="480" y="35" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cba6f7" text-anchor="middle" font-weight="600">LLM</text>
    <text x="480" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8" text-anchor="middle">DeepSeek</text>

    <!-- Tools node -->
    <rect x="400" y="160" width="160" height="80" rx="12" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
    <g transform="translate(430, 175)">
      <use data-icon="chunk-filled/code" width="24" height="24" fill="#89b4fa"/>
    </g>
    <text x="480" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#89b4fa" text-anchor="middle" font-weight="600">工具执行</text>

    <!-- State node -->
    <rect x="400" y="320" width="160" height="80" rx="12" fill="#181825" stroke="#f9e2af" stroke-width="2"/>
    <g transform="translate(430, 335)">
      <use data-icon="chunk-filled/heart-pulse" width="24" height="24" fill="#f9e2af"/>
    </g>
    <text x="480" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#f9e2af" text-anchor="middle" font-weight="600">状态更新</text>

    <!-- Arrow from LLM to Tools -->
    <path d="M480,80 L480,155" stroke="url(#arrowGradient)" stroke-width="2" fill="none" marker-end="url(#arrowHead)"/>

    <!-- Arrow from Tools to State -->
    <path d="M480,240 L480,315" stroke="url(#arrowGradient)" stroke-width="2" fill="none" marker-end="url(#arrowHead)"/>

    <!-- Arrow from State back to LLM -->
    <path d="M400,360 L320,360 L320,40 L400,40" stroke="#cba6f7" stroke-width="1.5" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowHead)"/>
    <text x="280" y="200" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086">循环</text>
  </g>

  <!-- Component list -->
  <g transform="translate(700, 160)">
    <text x="0" y="0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#cdd6f4" font-weight="600">核心组件</text>

    <!-- ReAct Loop -->
    <rect x="0" y="30" width="480" height="70" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
    <circle cx="35" cy="65" r="18" fill="#cba6f7" opacity="0.2"/>
    <text x="35" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#cba6f7" text-anchor="middle" font-weight="600">1</text>
    <text x="70" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">ReAct Loop</text>
    <text x="70" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">Vercel AI SDK 驱动的 ReAct 循环</text>

    <!-- State Management -->
    <rect x="0" y="115" width="480" height="70" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
    <circle cx="35" cy="150" r="18" fill="#f9e2af" opacity="0.2"/>
    <text x="35" y="155" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#f9e2af" text-anchor="middle" font-weight="600">2</text>
    <text x="70" y="138" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">State Management</text>
    <text x="70" y="158" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">无聊/精力/心情/temper，持久化到 JSON</text>

    <!-- Tool Registry -->
    <rect x="0" y="200" width="480" height="70" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
    <circle cx="35" cy="235" r="18" fill="#89b4fa" opacity="0.2"/>
    <text x="35" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#89b4fa" text-anchor="middle" font-weight="600">3</text>
    <text x="70" y="223" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">Tool Registry</text>
    <text x="70" y="243" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">工厂模式，工具包装为 AI SDK 兼容 tool</text>

    <!-- Memory System -->
    <rect x="0" y="285" width="480" height="70" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
    <circle cx="35" cy="320" r="18" fill="#cba6f7" opacity="0.2"/>
    <text x="35" y="325" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#cba6f7" text-anchor="middle" font-weight="600">4</text>
    <text x="70" y="308" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">Memory System</text>
    <text x="70" y="328" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">文件系统 Markdown 存储，INDEX.md 索引</text>

    <!-- LLM Client -->
    <rect x="0" y="370" width="480" height="70" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
    <circle cx="35" cy="405" r="18" fill="#89b4fa" opacity="0.2"/>
    <text x="35" y="410" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#89b4fa" text-anchor="middle" font-weight="600">5</text>
    <text x="70" y="393" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">LLM Client</text>
    <text x="70" y="413" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">DeepSeek provider via @ai-sdk/deepseek</text>
  </g>

  <!-- Footer -->
  <text x="640" y="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086" text-anchor="middle">03 / Memory</text>
</svg>