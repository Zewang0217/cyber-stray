<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradient)"/>

  <!-- Page header -->
  <text x="60" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6c7086">04 / Tools</text>
  <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">工具生态</text>

  <!-- Tools grid - 2 rows x 3 columns -->
  <!-- Row 1 -->
  <!-- search_web -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="360" height="130" rx="12" fill="#181825" stroke="#313244" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/search" width="36" height="36" fill="#cba6f7"/>
    </g>
    <text x="80" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">search_web</text>
    <text x="80" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">搜索工具</text>
    <text x="24" y="90" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">DuckDuckGo / Tavily / Exa</text>
    <text x="24" y="110" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">自适应选择最优引擎</text>
  </g>

  <!-- read_page -->
  <g transform="translate(460, 150)">
    <rect x="0" y="0" width="360" height="130" rx="12" fill="#181825" stroke="#313244" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/globe" width="36" height="36" fill="#89b4fa"/>
    </g>
    <text x="80" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">read_page</text>
    <text x="80" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">网页读取工具</text>
    <text x="24" y="90" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">@mozilla/readability</text>
    <text x="24" y="110" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">提取网页正文内容</text>
  </g>

  <!-- speak -->
  <g transform="translate(860, 150)">
    <rect x="0" y="0" width="360" height="130" rx="12" fill="#181825" stroke="#313244" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/play" width="36" height="36" fill="#f38ba8"/>
    </g>
    <text x="80" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">speak</text>
    <text x="80" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">推送工具</text>
    <text x="24" y="90" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">飞书 Webhook / Telegram Bot</text>
    <text x="24" y="110" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">主动推送有价值的内容</text>
  </g>

  <!-- Row 2 -->
  <!-- record_knowledge -->
  <g transform="translate(60, 310)">
    <rect x="0" y="0" width="360" height="130" rx="12" fill="#181825" stroke="#313244" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/database" width="36" height="36" fill="#f9e2af"/>
    </g>
    <text x="80" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">record_knowledge</text>
    <text x="80" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">知识记录工具</text>
    <text x="24" y="90" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">长期记忆存储</text>
    <text x="24" y="110" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">MemoryStore + Markdown 文件</text>
  </g>

  <!-- rest -->
  <g transform="translate(460, 310)">
    <rect x="0" y="0" width="360" height="130" rx="12" fill="#181825" stroke="#313244" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/heart" width="36" height="36" fill="#cba6f7"/>
    </g>
    <text x="80" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">rest</text>
    <text x="80" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">休息工具</text>
    <text x="24" y="90" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">能量管理与状态恢复</text>
    <text x="24" y="110" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">精力/无聊值回调</text>
  </g>

  <!-- observe_user -->
  <g transform="translate(860, 310)">
    <rect x="0" y="0" width="360" height="130" rx="12" fill="#181825" stroke="#313244" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <use data-icon="chunk-filled/users" width="36" height="36" fill="#89b4fa"/>
    </g>
    <text x="80" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#cdd6f4" font-weight="600">observe_user</text>
    <text x="80" y="58" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">用户观察工具</text>
    <text x="24" y="90" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">追踪用户反馈</text>
    <text x="24" y="110" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#6c7086">更新 userLikes / userDislikes</text>
  </g>

  <!-- Search adapter pattern -->
  <rect x="60" y="480" width="1160" height="160" rx="12" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="100" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#cdd6f4" font-weight="600">搜索适配器模式</text>
  <text x="100" y="545" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#a6adc8">统一 SearchAdapter 接口，根据 config.searchProvider 选择适配器</text>

  <g transform="translate(100, 570)">
    <!-- DuckDuckGo -->
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#cba6f7" opacity="0.15" stroke="#cba6f7" stroke-width="1"/>
    <text x="100" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#cba6f7" text-anchor="middle">DuckDuckGo</text>

    <path d="M210,25 L240,25" stroke="#313244" stroke-width="2" fill="none"/>

    <!-- Tavily -->
    <rect x="250" y="0" width="200" height="50" rx="8" fill="#89b4fa" opacity="0.15" stroke="#89b4fa" stroke-width="1"/>
    <text x="350" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#89b4fa" text-anchor="middle">Tavily</text>

    <path d="M460,25 L490,25" stroke="#313244" stroke-width="2" fill="none"/>

    <!-- Exa -->
    <rect x="500" y="0" width="200" height="50" rx="8" fill="#f9e2af" opacity="0.15" stroke="#f9e2af" stroke-width="1"/>
    <text x="600" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#f9e2af" text-anchor="middle">Exa</text>

    <path d="M710,25 L740,25" stroke="#313244" stroke-width="2" fill="none"/>

    <!-- Unified Interface -->
    <rect x="750" y="0" width="200" height="50" rx="8" fill="#f38ba8" opacity="0.15" stroke="#f38ba8" stroke-width="1"/>
    <text x="850" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#f38ba8" text-anchor="middle">SearchAdapter</text>
  </g>

  <!-- Footer -->
  <text x="640" y="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6c7086" text-anchor="middle">05 / Emotion</text>
</svg>