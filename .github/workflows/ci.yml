name: CI

# S12 纪律：构建在 CI，不在产机。产机只拉产物（web standalone）+ 源码
# （CP/agent 由 bun 直跑 TS，无编译步骤）+ pnpm install --frozen-lockfile。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build web (standalone)
        run: pnpm -F @cyber-stray/web build

      - name: Package deploy artifact
        run: |
          set -euo pipefail
          cd packages/web
          mkdir -p dist
          # 打包整个 standalone 树（含根 node_modules——packages/web 下的
          # next 是相对软链指向 standalone 根 .pnpm，只拷 packages/web 会
          # 悬空 → node server.js MODULE_NOT_FOUND）
          cp -r .next/standalone dist/app
          cp -r .next/static dist/app/packages/web/.next/static
          cp -r public dist/app/packages/web/public
          tar -czf ../../web-standalone.tar.gz -C dist .
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: web-standalone.tar.gz
          retention-days: 14
