name: CI

# #138 / ADR-0009：质量门（typecheck / test / lint + web 构建验证），不产镜像不推仓库。
# PR（→develop|main）直接跑；develop/main 的 push 由 CD 以 workflow_call 复用本门，
# 避免同一 push 跑两遍。
on:
  pull_request:
    branches: [develop, main]
  workflow_call:

jobs:
  verify:
    name: Verify + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMPDIR: ${{ github.workspace }}/scratch/tmp
      TMP: ${{ github.workspace }}/scratch/tmp
      TEMP: ${{ github.workspace }}/scratch/tmp
    steps:
      - name: Initialize repository temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: actions/checkout@v4
      # checkout may remove the untracked scratch directory.
      - name: Prepare repository temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check deployment guard
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py'

      - name: Lint
        run: pnpm lint

      - name: Build web
        run: pnpm -F @cyber-stray/web build

      - name: Clean repository temporary directory
        if: always()
        run: rm -rf -- "${{ github.workspace }}/scratch/tmp"
