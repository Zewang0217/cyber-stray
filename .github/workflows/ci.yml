name: CI

# #138 / ADR-0009：develop 是唯一集成区——push/PR 只跑质量门
# （typecheck / test / lint + web 构建验证），不产镜像不推仓库。
# 镜像构建与部署只在 main 发布流水线（deploy.yml，自带质量门）。
on:
  push:
    branches: [develop]
  pull_request:

jobs:
  verify:
    name: Verify + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build web (standalone, 产物验证)
        run: pnpm -F @cyber-stray/web build
