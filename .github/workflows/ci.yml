name: CI

# #138 / ADR-0009：develop 是唯一集成区——push/PR 只跑质量门
# （typecheck / test / lint + web 构建验证），不产镜像不推仓库。
# 功能 PR（→develop）和发布 PR（develop→main，ADR-0009）均跑质量门。
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    name: Verify + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMPDIR: ${{ github.workspace }}/scratch/tmp
      TMP: ${{ github.workspace }}/scratch/tmp
      TEMP: ${{ github.workspace }}/scratch/tmp
    steps:
      - name: Initialize repository temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: actions/checkout@v4
      # checkout may remove the untracked scratch directory.
      - name: Prepare repository temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check deployment guard
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py'

      - name: Lint
        run: pnpm lint

      - name: Build web & site
        env:
          NEXT_PUBLIC_APP_URL: https://app.kleinbottle.top
        run: |
          pnpm -F @cyber-stray/web build
          pnpm -F @cyber-stray/site build

      - name: Clean repository temporary directory
        if: always()
        run: rm -rf -- "${{ github.workspace }}/scratch/tmp"
