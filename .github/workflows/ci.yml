name: CI

# #138 / ADR-0009：develop 是唯一集成区——push/PR 只跑质量门
# （typecheck / test / lint + web 构建验证），不产镜像不推仓库。
# 发布 PR（develop→main，ADR-0009）不重复跑质量门：其 head 就是 develop，
# 同一 commit 已由 push:develop 触发过；PR 事件只对 base 为 develop 的 PR 生效。
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  verify:
    name: Verify + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build web
        run: pnpm -F @cyber-stray/web build