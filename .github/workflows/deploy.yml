name: CD Deploy

# main 合并 = 一次生产发布（ADR-0009）：构建推送在 GitHub runner 完成，
# 部署 = SSH 进生产机同步 deploy/ 配置 + 拉镜像 + 起容器。
# 回滚：compose.yaml 的 IMAGE_TAG 占位改成旧 sha 合并 main 重发（跳过构建）。
# 密钥（仓库不存值）：PROD_HOST / PROD_USER / PROD_SSH_PORT / PROD_SSH_KEY；
# GHCR 推送用 GITHUB_TOKEN。fork PR 不会触达本流水线。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    name: Image build & Production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: typecheck & test & lint + web/site construct
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm -F @cyber-stray/web build
          pnpm -F @cyber-stray/site build

      - name: Parse and publish the tag
        id: tag
        run: |
          set -euo pipefail
          compose_file="deploy/compose.yaml"
          default_tag="$(sed -nE 's/.*IMAGE_TAG:-([^}]+)}.*/\1/p' "$compose_file" | head -1)"
          case "$default_tag" in
            sha)
              echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              echo "build=1" >> "$GITHUB_OUTPUT"   # 常规发布：构建本次 sha 镜像
              ;;
            [0-9a-f]|[0-9a-f][0-9a-f]*)
              echo "tag=$default_tag" >> "$GITHUB_OUTPUT"
              echo "build=0" >> "$GITHUB_OUTPUT"   # 回滚：compose 已钉旧 sha，只拉取部署
              ;;
            *)
              echo "无法解析 compose.yaml 的 IMAGE_TAG 占位（got: $default_tag）" >&2
              exit 1
              ;;
          esac

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the application image (control plane + agent)
        if: steps.tag.outputs.build == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: true
          tags: ghcr.io/zewang0217/cyber-stray-app:${{ steps.tag.outputs.tag }}

      - name: Build & push web image
        if: steps.tag.outputs.build == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ghcr.io/zewang0217/cyber-stray-web:${{ steps.tag.outputs.tag }}

      # 官网 CTA 地址构建期烘焙：仓库 variable APP_URL（伴侣端对外 https 地址）；
      # 未配置时 Dockerfile 回落 127.0.0.1:3000（仅本机联调形态）
      - name: Build & push site image
        if: steps.tag.outputs.build == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.site
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
          tags: ghcr.io/zewang0217/cyber-stray-site:${{ steps.tag.outputs.tag }}

      - name: Sync deploy config to production
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PROD_SSH_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -P "$PROD_SSH_PORT" -i ~/.ssh/deploy_key \
            deploy/compose.yaml \
            deploy/container-update.sh \
            deploy/backup.sh \
            deploy/restore.sh \
            "${PROD_USER}@${PROD_HOST}:/opt/cyber-stray/deploy/"
          # casdoor 配置同步到暂存位；container-update.sh 比对内容，
          # 有变化才覆盖到 /opt/cyber-stray/casdoor/conf/ 并重启。
          # 一并同步 .env.example（键清单模板，container-update.sh 做键集校验）
          # 与 nginx ingress 路由配置；acme-webroot 供 certbot HTTP-01 验证
          ssh -p "$PROD_SSH_PORT" -i ~/.ssh/deploy_key \
            "${PROD_USER}@${PROD_HOST}" \
            "mkdir -p /opt/cyber-stray/deploy/casdoor /opt/cyber-stray/deploy/nginx /opt/cyber-stray/acme-webroot"
          scp -P "$PROD_SSH_PORT" -i ~/.ssh/deploy_key \
            deploy/casdoor/app.conf \
            "${PROD_USER}@${PROD_HOST}:/opt/cyber-stray/deploy/casdoor/"
          scp -P "$PROD_SSH_PORT" -i ~/.ssh/deploy_key \
            .env.example \
            "${PROD_USER}@${PROD_HOST}:/opt/cyber-stray/.env.example"
          scp -P "$PROD_SSH_PORT" -i ~/.ssh/deploy_key \
            deploy/nginx/cyber-stray.conf \
            "${PROD_USER}@${PROD_HOST}:/opt/cyber-stray/deploy/nginx/"
          # 兜底：脚本可执行位（git 在 Windows 侧记录 644 时 scp 后不可执行）
          ssh -p "$PROD_SSH_PORT" -i ~/.ssh/deploy_key \
            "${PROD_USER}@${PROD_HOST}" \
            "chmod +x /opt/cyber-stray/deploy/container-update.sh /opt/cyber-stray/deploy/backup.sh /opt/cyber-stray/deploy/restore.sh"
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

      - name: Deployment (pull image + start container + health check + image cleanup)
        run: |
          ssh -p "$PROD_SSH_PORT" -i ~/.ssh/deploy_key \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo -n /opt/cyber-stray/deploy/container-update.sh --tag '$TAG'"
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          TAG: ${{ steps.tag.outputs.tag }}