name: CD Deploy

# 手动触发部署(workflow_dispatch)。
# 架构(国内服务器适配):
#   - verify: GitHub-hosted(美国 runner)跑 check(类型/测试/lint)+ 构建验证
#   - deploy: 服务器自托管 runner(self-hosted,出站连 GitHub 稳定)
#     本地 checkout + 构建 + deploy.sh update(免 artifact 传输,
#     服务器到 GitHub artifact 下载端点慢,直连不稳定)
#
# 前置:
#   - 产机一次性:deploy.sh install + 自托管 runner(svc.sh)注册为 self-hosted
#   - .env 配置 CASDOOR 三件套 / CP_ADMIN_SUBS / LLM keys
#
# 产物:web standalone 由 deploy job 在服务器本地构建(零编译部署原则的
# 例外:国内服务器从 GitHub 拉 artifact 不可靠,改为本地构建一次)

on:
  # merge main 自动部署;也可手动触发(workflow_dispatch)
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build web (standalone, 产物验证)
        run: pnpm -F @cyber-stray/web build

  deploy:
    needs: verify
    runs-on: self-hosted # 服务器自托管 runner(cyberstray 用户)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: |
          # 国内服务器:依赖走 npmmirror(直连 npmjs 慢)
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --frozen-lockfile

      - name: Build web standalone
        run: pnpm -F @cyber-stray/web build

      - name: Package artifact
        run: |
          set -euo pipefail
          cd packages/web
          mkdir -p dist
          cp -r .next/standalone dist/app
          cp -r .next/static dist/app/packages/web/.next/static
          cp -r public dist/app/packages/web/public
          tar -czf ../../web-standalone.tar.gz -C dist .

      - name: Incremental deploy (local deploy.sh update)
        run: |
          set -euo pipefail
          # cyberstray 用户 sudoers 已放行此 deploy.sh(最小权限)
          sudo -n /opt/cyber-stray/packages/control-plane/deploy/deploy.sh update \
            --web-tar "${GITHUB_WORKSPACE}/web-standalone.tar.gz"

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -sf http://localhost:8787/healthz >/dev/null && echo "CP healthz OK"
          curl -sfI http://localhost:3000 >/dev/null && echo "Web OK"
          echo "部署完成"
