name: CD Deploy

# main 合并 = 一次生产发布（ADR-0009）：构建推送在 GitHub runner 完成，
# 部署 = runner 导出镜像包 + Actions 产物 HTTPS 下载 + 生产校验导入 + 起容器（生产不访问 registry）。
# 回滚：compose.yaml 的 IMAGE_TAG 占位改成旧 sha 合并 main 重发（跳过构建）。
# 密钥（仓库不存值）：PROD_HOST / PROD_USER / PROD_SSH_PORT / PROD_SSH_KEY；
# GHCR 推送用 GITHUB_TOKEN。fork PR 不会触达本流水线。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write # 创建并在发布结束后删除本次临时构建产物

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    name: Image build & Production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMPDIR: ${{ github.workspace }}/scratch/tmp
      TMP: ${{ github.workspace }}/scratch/tmp
      TEMP: ${{ github.workspace }}/scratch/tmp
      DOCKER_CONFIG: ${{ github.workspace }}/scratch/tmp/docker
    steps:
      - name: Initialize repository temporary directory
        run: mkdir -p "$TMPDIR" "$DOCKER_CONFIG"
      - uses: actions/checkout@v4
      # checkout may remove the untracked scratch directory.
      - name: Prepare repository temporary directory
        run: mkdir -p "$TMPDIR" "$DOCKER_CONFIG"
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate deployment mode and public application URL
        env:
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE || 'https_domains' }}
          PUBLIC_IP: ${{ vars.PUBLIC_IP }}
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: node deploy/check-site-url.mjs

      - name: typecheck & test & lint + web/site construct
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: |
          pnpm typecheck
          pnpm test
          python3 -B -m unittest discover -s deploy -p 'test_*.py'
          pnpm lint
          pnpm -F @cyber-stray/web build
          pnpm -F @cyber-stray/site build

      - name: Parse and publish the tag
        id: tag
        run: |
          set -euo pipefail
          compose_file="deploy/compose.yaml"
          default_tag="$(sed -nE 's/.*IMAGE_TAG:-([^}]+)}.*/\1/p' "$compose_file" | head -1)"
          case "$default_tag" in
            sha)
              echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              echo "build=1" >> "$GITHUB_OUTPUT"   # 常规发布：构建本次 sha 镜像
              ;;
            [0-9a-f]|[0-9a-f][0-9a-f]*)
              echo "tag=$default_tag" >> "$GITHUB_OUTPUT"
              echo "build=0" >> "$GITHUB_OUTPUT"   # 回滚：runner 拉取旧镜像后转运部署
              ;;
            *)
              echo "无法解析 compose.yaml 的 IMAGE_TAG 占位（got: $default_tag）" >&2
              exit 1
              ;;
          esac

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the application image (control plane + agent)
        if: steps.tag.outputs.build == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: true
          tags: ghcr.io/zewang0217/cyber-stray-app:${{ steps.tag.outputs.tag }}

      - name: Build & push web image
        if: steps.tag.outputs.build == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ghcr.io/zewang0217/cyber-stray-web:${{ steps.tag.outputs.tag }}

      # 官网 CTA 地址构建期烘焙：仓库 variable APP_URL（伴侣端对外地址）；
      # 未配置时构建失败，防止把本地地址发布到官网。
      - name: Build & push site image
        if: steps.tag.outputs.build == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.site
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
            DEPLOY_MODE=${{ vars.DEPLOY_MODE || 'https_domains' }}
            PUBLIC_IP=${{ vars.PUBLIC_IP }}
          tags: ghcr.io/zewang0217/cyber-stray-site:${{ steps.tag.outputs.tag }}

      - name: Export checked image bundle (all Compose services)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python3 -B deploy/image-bundle.py pack --tag "$TAG" --compose deploy/compose.yaml --bundle "$TMPDIR/bundle"

      - name: Upload temporary deployment artifact
        id: bundle-upload
        uses: actions/upload-artifact@v4
        with:
          name: deploy-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TMPDIR }}/bundle/images.tar.gz
            ${{ env.TMPDIR }}/bundle/release.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Sync deploy config to production
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR/ssh"
          chmod 700 "$TMPDIR/ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$TMPDIR/ssh/deploy_key"
          chmod 600 "$TMPDIR/ssh/deploy_key"
          ssh-keyscan -p "$PROD_SSH_PORT" "$PROD_HOST" > "$TMPDIR/ssh/known_hosts" 2>/dev/null
          # 服务器属主不可预测（deploy/ 平面可写；deploy/nginx/、顶层等
          # root 属主——#306 发布 CD 两连挂皆由此）：CI 只往 deploy/ 平面
          # 暂存位同步，一切落位（casdoor conf / .env.example / nginx conf
          # / acme-webroot）由 root 身份的 container-update.sh 统一完成
          scp -o BatchMode=yes -o UserKnownHostsFile="$TMPDIR/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -P "$PROD_SSH_PORT" -i "$TMPDIR/ssh/deploy_key" \
            deploy/compose.yaml \
            deploy/compose.http-ip.yaml \
            deploy/container-update.sh \
            deploy/check-production.py \
            deploy/image-bundle.py \
            deploy/compose.bootstrap.yaml \
            deploy/nginx-bootstrap.conf \
            deploy/backup.sh \
            deploy/restore.sh \
            deploy/casdoor/app.conf \
            deploy/casdoor/app.http-ip.conf \
            deploy/nginx/cyber-stray.conf \
            deploy/nginx/cyber-stray.http-ip.conf \
            "${PROD_USER}@${PROD_HOST}:/opt/cyber-stray/deploy/"
          scp -o BatchMode=yes -o UserKnownHostsFile="$TMPDIR/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -P "$PROD_SSH_PORT" -i "$TMPDIR/ssh/deploy_key" \
            .env.example "${PROD_USER}@${PROD_HOST}:/opt/cyber-stray/deploy/env.example"
          # 兜底：脚本可执行位（git 在 Windows 侧记录 644 时 scp 后不可执行）
          ssh -o BatchMode=yes -o UserKnownHostsFile="$TMPDIR/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" -i "$TMPDIR/ssh/deploy_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "chmod +x /opt/cyber-stray/deploy/container-update.sh /opt/cyber-stray/deploy/backup.sh /opt/cyber-stray/deploy/restore.sh"
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

      - name: Download image bundle from Actions over HTTPS
        timeout-minutes: 22
        run: |
          set -euo pipefail
          remote_dir="/opt/cyber-stray/scratch/cd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -B deploy/image-bundle.py link --bundle "$TMPDIR/bundle" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --download-proxy "$CD_DOWNLOAD_PROXY"
          ssh -o BatchMode=yes -o UserKnownHostsFile="$TMPDIR/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" -i "$TMPDIR/ssh/deploy_key" "${PROD_USER}@${PROD_HOST}" \
            "sudo -n /opt/cyber-stray/deploy/container-update.sh --prepare-image-bundle 'cd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"
          scp -o BatchMode=yes -o UserKnownHostsFile="$TMPDIR/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -P "$PROD_SSH_PORT" -i "$TMPDIR/ssh/deploy_key" \
            "$TMPDIR/bundle/download.json" "${PROD_USER}@${PROD_HOST}:$remote_dir/"
          ssh -o BatchMode=yes -o UserKnownHostsFile="$TMPDIR/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" -i "$TMPDIR/ssh/deploy_key" "${PROD_USER}@${PROD_HOST}" \
            "TMPDIR='$remote_dir' TMP='$remote_dir' TEMP='$remote_dir' python3 -B /opt/cyber-stray/deploy/image-bundle.py download --bundle '$remote_dir'"
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.bundle-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.bundle-upload.outputs.artifact-digest }}
          CD_DOWNLOAD_PROXY: ${{ vars.CD_DOWNLOAD_PROXY }}

      - name: Deployment (verify + load + start without pull + health check + image cleanup)
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE" in https_domains|http_ip) ;; *) exit 2 ;; esac
          if [[ -n "$PUBLIC_IP" && ! "$PUBLIC_IP" =~ ^[0-9.]+$ ]]; then exit 2; fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7,64}$ ]]; then exit 2; fi
          remote_dir="/opt/cyber-stray/scratch/cd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o BatchMode=yes -o UserKnownHostsFile="$TMPDIR/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" -i "$TMPDIR/ssh/deploy_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo -n /opt/cyber-stray/deploy/container-update.sh --tag '$TAG' --mode '$DEPLOY_MODE' --public-ip '$PUBLIC_IP' --image-bundle '$remote_dir'"
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE || 'https_domains' }}
          PUBLIC_IP: ${{ vars.PUBLIC_IP }}

      - name: Clean production transfer directory
        if: always()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          # No key means deployment never reached SSH preparation.
          [ -f "$TMPDIR/ssh/deploy_key" ] || exit 0
          remote_dir="/opt/cyber-stray/scratch/cd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o BatchMode=yes -o UserKnownHostsFile="$TMPDIR/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" -i "$TMPDIR/ssh/deploy_key" "${PROD_USER}@${PROD_HOST}" \
            "sudo -n /opt/cyber-stray/deploy/container-update.sh --clean-image-bundle 'cd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Delete temporary deployment artifact
        if: always() && steps.bundle-upload.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.bundle-upload.outputs.artifact-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"

      - name: Clean repository temporary directory
        if: always()
        run: rm -rf -- "${{ github.workspace }}/scratch/tmp"
