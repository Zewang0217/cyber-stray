name: CD

# develop push → staging 发布；main 合并 = 生产发布（ADR-0009）。
# 构建与推送在 runner 完成（GHCR 留档，ADR-0008）；镜像包经阿里云 OSS 转运
# （releases/<sha>/images.tar.zst + release.json），服务器下载装载后由 deploy.sh
# `compose up --pull never` 拉起——服务器不接触 GitHub / 镜像仓库，无仓库文件同步。
# 回滚：服务器上 `sudo /srv/cyber-stray/deploy.sh <env> <旧 sha>`（OSS 保留历史版本包）。
# Secrets：PROD_HOST / PROD_USER / PROD_SSH_PORT / PROD_SSH_KEY、
#          OSS_CI_ACCESS_KEY_ID / OSS_CI_ACCESS_KEY_SECRET；
# Vars：OSS_BUCKET / OSS_ENDPOINT / OSS_REGION。GHCR 推送用 GITHUB_TOKEN。fork PR 不触达本流水线。
on:
  push:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/scratch/tmp
      TMP: ${{ github.workspace }}/scratch/tmp
      TEMP: ${{ github.workspace }}/scratch/tmp
      DOCKER_CONFIG: ${{ github.workspace }}/scratch/tmp/docker
      # ossutil 2.x 凭据注入：优先级 命令行 > 环境变量 > 配置文件，走环境变量避免密钥进进程命令行
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_CI_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_CI_ACCESS_KEY_SECRET }}
    steps:
      - name: Initialize repository temporary directory
        run: mkdir -p "$TMPDIR" "$DOCKER_CONFIG"
      - uses: actions/checkout@v4
      # checkout may remove the untracked scratch directory.
      - name: Prepare repository temporary directory
        run: mkdir -p "$TMPDIR" "$DOCKER_CONFIG"

      - name: Resolve target environment
        id: env
        run: |
          case "$GITHUB_REF" in
            refs/heads/develop) echo "name=staging" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main) echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown release ref: $GITHUB_REF" >&2; exit 1 ;;
          esac

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push application image (control plane + agent)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: true
          tags: ghcr.io/zewang0217/cyber-stray-app:${{ github.sha }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ghcr.io/zewang0217/cyber-stray-web:${{ github.sha }}

      - name: Build & push ingress image (Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.caddy
          push: true
          tags: ghcr.io/zewang0217/cyber-stray-caddy:${{ github.sha }}

      - name: Pack image bundle
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR/bundle"
          # 第三方镜像随包转运：服务器全程 --pull never，不依赖 Docker Hub 可达性
          docker pull casbin/casdoor:3.159.0
          docker save \
            "ghcr.io/zewang0217/cyber-stray-app:$GITHUB_SHA" \
            "ghcr.io/zewang0217/cyber-stray-web:$GITHUB_SHA" \
            "ghcr.io/zewang0217/cyber-stray-caddy:$GITHUB_SHA" \
            casbin/casdoor:3.159.0 \
            | zstd -T0 -o "$TMPDIR/bundle/images.tar.zst"
          # release.json 契约：tag、镜像清单、整包 sha256——deploy.sh 逐项校验，不符即失败
          jq -n \
            --arg tag "$GITHUB_SHA" \
            --arg sha256 "$(sha256sum "$TMPDIR/bundle/images.tar.zst" | cut -d' ' -f1)" \
            '{tag: $tag, images: ["ghcr.io/zewang0217/cyber-stray-app:" + $tag, "ghcr.io/zewang0217/cyber-stray-web:" + $tag, "ghcr.io/zewang0217/cyber-stray-caddy:" + $tag, "casbin/casdoor:3.159.0"], sha256: $sha256}' \
            > "$TMPDIR/bundle/release.json"

      - name: Install ossutil 2.x
        run: |
          set -euo pipefail
          curl -fsSLo "$TMPDIR/ossutil.zip" https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  $TMPDIR/ossutil.zip" | sha256sum -c -
          unzip -q -d "$TMPDIR" "$TMPDIR/ossutil.zip"
          sudo install -m 755 "$TMPDIR"/ossutil-2.4.0-linux-amd64/ossutil /usr/local/bin/ossutil

      - name: Upload bundle to OSS
        env:
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          ossutil cp -f "$TMPDIR/bundle/images.tar.zst" "oss://$OSS_BUCKET/releases/$GITHUB_SHA/images.tar.zst" -e "$OSS_ENDPOINT"
          ossutil cp -f "$TMPDIR/bundle/release.json" "oss://$OSS_BUCKET/releases/$GITHUB_SHA/release.json" -e "$OSS_ENDPOINT"

      - name: Deploy on server
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          TARGET_ENV: ${{ steps.env.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR/ssh"
          chmod 700 "$TMPDIR/ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$TMPDIR/ssh/deploy_key"
          chmod 600 "$TMPDIR/ssh/deploy_key"
          ssh-keyscan -p "$PROD_SSH_PORT" "$PROD_HOST" > "$TMPDIR/ssh/known_hosts" 2>/dev/null
          ssh -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            -o UserKnownHostsFile="$TMPDIR/ssh/known_hosts" -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" -i "$TMPDIR/ssh/deploy_key" \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo -n /srv/cyber-stray/deploy.sh '$TARGET_ENV' '$GITHUB_SHA'"

      - name: Clean repository temporary directory
        if: always()
        run: rm -rf -- "${{ github.workspace }}/scratch/tmp"
